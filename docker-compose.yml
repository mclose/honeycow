name: honeycow

services:
  honey-ns:
    # Flagship builds locally (HONEY_IMAGE unset -> honeycow:latest, tagged by
    # the build). A herd cow sets HONEY_IMAGE to a pinned GHCR tag
    # (ghcr.io/<owner>/honeycow:sha-xxxx) and runs a build-less compose so it
    # pulls the prebuilt artifact instead of compiling on a throwaway VPS.
    build: .
    image: ${HONEY_IMAGE:-honeycow:latest}
    container_name: honeycow
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    mem_limit: 256m
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "80:80/tcp"
    volumes:
      - honeycow_logs:/var/log/honeycow
      # config/ is bind-mounted (directory, not single file) so editing
      # exemptions.txt in any way — including atomic-rename writes from rsync
      # or text editors — is visible to the container immediately. Single-file
      # bind mounts pin to the source inode and miss replacements.
      # Reload with: `docker kill -s HUP honeycow`
      - ./config:/etc/honeycow:ro
    environment:
      HONEY_PUBLIC_A: ${HONEY_PUBLIC_A:?HONEY_PUBLIC_A must be set to the public IPv4 of this host}
      HONEY_PUBLIC_AAAA: ${HONEY_PUBLIC_AAAA:-}
      HONEY_SINKHOLE_A: ${HONEY_SINKHOLE_A:-}
      HONEY_SINKHOLE_AAAA: ${HONEY_SINKHOLE_AAAA:-}
      HONEY_DOMAIN: ${HONEY_DOMAIN:-example.com.}
      HONEY_NS_HOSTS: ${HONEY_NS_HOSTS:-ns1.example.com,ns2.example.com}
      HONEY_ABUSE_EMAIL: ${HONEY_ABUSE_EMAIL:-abuse@example.com}
      HONEY_ABUSE_URL: ${HONEY_ABUSE_URL:-https://example.com}
      HONEY_TXT_CALLING_CARD: "${HONEY_TXT_CALLING_CARD:-honeycow: this is not the cow you are looking for. a polite ns squatter. https://example.com abuse@example.com}"
      HONEY_VERSION_BIND_TXT: "${HONEY_VERSION_BIND_TXT:-}"
      # Herd vantage-point id, stamped onto every event as site_id. Unset on
      # the flagship (single cow) -> empty -> field omitted, logs unchanged.
      # A herd cow sets this so its digests stay attributable once merged.
      HONEY_SITE_ID: ${HONEY_SITE_ID:-}
      HONEY_LOG: /var/log/honeycow/events.jsonl
      HONEY_EXEMPTION_FILE: /etc/honeycow/exemptions.txt
      HONEY_STATIC_INDEX: /app/static/index.html
      HONEY_BIND_V4: 0.0.0.0
      HONEY_BIND_V6: "::"
      HONEY_PORT: 53
      HONEY_HTTP_PORT: 80
      HONEY_TCP_TIMEOUT: 5
      HONEY_TCP_MAX_CONNS: 50
      HONEY_TCP_ACCEPT_BACKLOG: 100
      HONEY_TCP_MAX_QUERIES_PER_CONN: 32
      HONEY_UDP_RATELIMIT_ENABLED: ${HONEY_UDP_RATELIMIT_ENABLED:-1}
      HONEY_UDP_RATELIMIT_RATE: ${HONEY_UDP_RATELIMIT_RATE:-200}
      HONEY_UDP_RATELIMIT_BURST: ${HONEY_UDP_RATELIMIT_BURST:-400}

volumes:
  honeycow_logs:
