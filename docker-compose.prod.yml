name: honeycow

# Production overlay. The canonical prod stack is:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   (or `make up-prod` / `make deploy`)
#
# What this overlay adds on top of docker-compose.yml:
#
#   1. honey-ns ports are rebound to specific public IPs from .env
#      (HONEY_PUBLIC_A / HONEY_PUBLIC_AAAA) instead of 0.0.0.0/::, which
#      avoids collisions with systemd-resolved on 127.0.0.53 and makes
#      the listening interfaces explicit.
#
#   2. honey-ns's public :80 binding is dropped — Caddy owns :80 (and
#      :443) and reverse-proxies non-honeycow.net Host headers to
#      honey-ns:80 over the compose network. The honey-ns HTTP closer
#      stays reachable internally; only Caddy is publicly listening on
#      port 80.
#
#   3. caddy + acme sidecars are introduced:
#        - caddy: terminates TLS for honeycow.net using a cert managed
#          by acme.sh; reverse-proxies everything else on :80 to the
#          honey-ns closer.
#        - acme: runs acme.sh as a daemon, issues/renews honeycow.net's
#          cert via DNS-01 over BIND nsupdate (RFC 2136). The reload
#          hook posts to Caddy's admin API on the internal network.
#
# Required .env values (gitignored, set per host):
#   HONEY_PUBLIC_A         public IPv4 (NS glue + sinkhole + host bind)
#   HONEY_PUBLIC_AAAA      public IPv6 (same; empty disables v6 listeners)
#   ACME_NSUPDATE_SERVER   BIND host accepting TSIG updates
#   ACME_NSUPDATE_ZONE     e.g. honeycow.net
#
# Required gitignored files:
#   acme/tsig.key          TSIG key for nsupdate (mounted into acme)
#
# First-time cert issue (run once, before Caddy can start cleanly):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     run --rm acme --register-account -m matthew@example.com
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     run --rm acme --issue --dns dns_nsupdate -d honeycow.net \
#     --server letsencrypt
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     run --rm acme --install-cert -d honeycow.net \
#     --fullchain-file /certs/honeycow.net/fullchain.pem \
#     --key-file /certs/honeycow.net/privkey.pem \
#     --reloadcmd 'wget -q -O- --post-data="" http://caddy:2019/load || true'
#
# IPv6 ingress: v6 queries reach honeycow via docker-proxy on the host's
# v6 listener, but without a v6-enabled docker network the proxy
# translates v6→v4 internally and the container sees the docker bridge
# gateway as `src_ip` instead of the real v6 client. Enabling v6 on the
# default network and assigning a ULA subnet gives the container a v6
# address on its own interface, so docker-proxy can preserve the
# original source. Recreating the network requires bringing every
# service that holds an endpoint on it (honey-ns, caddy, acme) down
# first; do that with `make down-prod` before the first deploy that
# lands this config.

networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:beef:beef::/64

services:
  honey-ns:
    # Drop public :80 (Caddy owns it). Rebind :53 to specific public
    # IPs from .env so we don't conflict with systemd-resolved.
    ports: !override
      - "${HONEY_PUBLIC_A:?HONEY_PUBLIC_A must be set in .env}:53:53/udp"
      - "${HONEY_PUBLIC_A:?HONEY_PUBLIC_A must be set in .env}:53:53/tcp"
      - "[${HONEY_PUBLIC_AAAA:?HONEY_PUBLIC_AAAA must be set in .env (empty value disables v6)}]:53:53/udp"
      - "[${HONEY_PUBLIC_AAAA:?HONEY_PUBLIC_AAAA must be set in .env (empty value disables v6)}]:53:53/tcp"

  caddy:
    image: caddy:2-alpine
    container_name: honeycow-caddy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./static:/srv/honeycow:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_certs:/certs:ro
    depends_on:
      - honey-ns

  acme:
    image: neilpang/acme.sh:latest
    container_name: honeycow-acme
    restart: unless-stopped
    command: daemon
    environment:
      NSUPDATE_SERVER: ${ACME_NSUPDATE_SERVER:?ACME_NSUPDATE_SERVER must be set to the BIND host accepting TSIG updates}
      NSUPDATE_KEY: /etc/acme/tsig.key
      NSUPDATE_ZONE: ${ACME_NSUPDATE_ZONE:-honeycow.net}
    volumes:
      - acme_data:/acme.sh
      - caddy_certs:/certs
      - ./acme/tsig.key:/etc/acme/tsig.key:ro

volumes:
  caddy_data:
  caddy_config:
  caddy_certs:
  acme_data:
