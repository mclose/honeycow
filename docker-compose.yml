name: honeycow

services:
  honey-ns:
    build: .
    image: honeycow:latest
    container_name: honeycow
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    mem_limit: 256m
    ports:
      - "53:53/udp"
      - "53:53/tcp"
      - "80:80/tcp"
    volumes:
      - honeycow_logs:/var/log/honeycow
      # exemptions.txt is bind-mounted so `kill -HUP 1` after editing reloads
      # without rebuilding the image.
      - ./exemptions.txt:/etc/honeycow/exemptions.txt:ro
    environment:
      HONEY_PUBLIC_A: ${HONEY_PUBLIC_A:?HONEY_PUBLIC_A must be set to the public IPv4 of this host}
      HONEY_PUBLIC_AAAA: ${HONEY_PUBLIC_AAAA:-}
      HONEY_SINKHOLE_A: ${HONEY_SINKHOLE_A:-}
      HONEY_SINKHOLE_AAAA: ${HONEY_SINKHOLE_AAAA:-}
      HONEY_DOMAIN: ${HONEY_DOMAIN:-honeycow.net.}
      HONEY_NS_HOSTS: ${HONEY_NS_HOSTS:-ns1.honeycow.net,ns2.honeycow.net}
      HONEY_ABUSE_EMAIL: ${HONEY_ABUSE_EMAIL:-abuse@honeycow.net}
      HONEY_ABUSE_URL: ${HONEY_ABUSE_URL:-https://honeycow.net}
      HONEY_TXT_CALLING_CARD: ${HONEY_TXT_CALLING_CARD:-honeycow: this is not the cow you are looking for. a polite ns squatter. https://honeycow.net abuse@honeycow.net}
      HONEY_LOG: /var/log/honeycow/events.jsonl
      HONEY_EXEMPTION_FILE: /etc/honeycow/exemptions.txt
      HONEY_STATIC_INDEX: /app/static/index.html
      HONEY_BIND_V4: 0.0.0.0
      HONEY_BIND_V6: "::"
      HONEY_PORT: 53
      HONEY_HTTP_PORT: 80
      HONEY_TCP_TIMEOUT: 5
      HONEY_TCP_MAX_CONNS: 50
      HONEY_TCP_ACCEPT_BACKLOG: 100
      HONEY_TCP_MAX_QUERIES_PER_CONN: 32
      HONEY_UDP_RATELIMIT_ENABLED: ${HONEY_UDP_RATELIMIT_ENABLED:-1}
      HONEY_UDP_RATELIMIT_RATE: ${HONEY_UDP_RATELIMIT_RATE:-200}
      HONEY_UDP_RATELIMIT_BURST: ${HONEY_UDP_RATELIMIT_BURST:-400}

volumes:
  honeycow_logs:
