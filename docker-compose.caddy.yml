# Opt-in Caddy + acme.sh overlay.
#
# Adds:
#   - caddy:     public :80/:443. Serves honeycow.net explainer on HTTPS;
#                reverse-proxies anything else on :80 to the honey-ns closer.
#   - acme:      runs acme.sh daemon, issues/renews honeycow.net cert via
#                DNS-01 over BIND nsupdate (RFC 2136). Reload hook hits
#                Caddy's admin API on the internal compose network.
#
# Honey-ns's public :80 mapping is dropped here; the closer keeps binding to
# its container's :80 and is only reachable from Caddy via the compose
# network.
#
# Bring up:
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d
#
# First-time cert issue (run once, before Caddy can start cleanly):
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml \
#     run --rm acme --register-account -m matthew@example.com
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml \
#     run --rm acme --issue --dns dns_nsupdate -d honeycow.net \
#     --server letsencrypt
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml \
#     run --rm acme --install-cert -d honeycow.net \
#     --fullchain-file /certs/honeycow.net/fullchain.pem \
#     --key-file /certs/honeycow.net/privkey.pem \
#     --reloadcmd 'wget -q -O- --post-data="" http://caddy:2019/load || true'
#
# Required env (commit to gitignored .env, do not paste here):
#   ACME_NSUPDATE_SERVER  - "ns1.deflationhollow.net" (resolvable on VPS)
#   ACME_DOMAIN           - "honeycow.net"
#   The TSIG key file goes at ./acme/tsig.key (gitignored).

name: honeycow

services:
  honey-ns:
    # Drop public :80; Caddy owns it now. DNS ports stay published.
    ports: !override
      - "53:53/udp"
      - "53:53/tcp"

  caddy:
    image: caddy:2-alpine
    container_name: honeycow-caddy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./static:/srv/honeycow:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_certs:/certs:ro
    depends_on:
      - honey-ns

  acme:
    image: neilpang/acme.sh:latest
    container_name: honeycow-acme
    restart: unless-stopped
    command: daemon
    environment:
      NSUPDATE_SERVER: ${ACME_NSUPDATE_SERVER:?ACME_NSUPDATE_SERVER must be set to the BIND host accepting TSIG updates}
      NSUPDATE_KEY: /etc/acme/tsig.key
      NSUPDATE_ZONE: ${ACME_NSUPDATE_ZONE:-honeycow.net}
    volumes:
      - acme_data:/acme.sh
      - caddy_certs:/certs
      - ./acme/tsig.key:/etc/acme/tsig.key:ro

volumes:
  caddy_data:
  caddy_config:
  caddy_certs:
  acme_data:
