name: image

# Build (and, on main, publish) the honeycow container image to GHCR so herd
# cows pull a prebuilt artifact instead of building on a throwaway $4 VPS.
#
# Decisions (2026-06-22, with Matthew):
#   - Public package: the image carries no identity strings (all env-driven),
#     so cows pull with zero auth — no secret lands on a throwaway box.
#     NOTE: the first push creates the package as PRIVATE; flip it to public
#     once in the GHCR package settings (deliberate, one-time, like the DS
#     submission). Until then, public pulls 404.
#   - linux/amd64 only (all current VPSes are x86; add arm64 later if needed).
#   - Tag `latest` + `sha-<short>`; cows pin to the immutable SHA so a bad
#     push can't silently propagate across the herd.
#
# On pull requests we build but DO NOT push — catches a broken Dockerfile at
# review time without needing registry creds.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Owner is derived, never hardcoded, so a fork/rename keeps working.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/honeycow
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      # Only authenticate when we're actually going to push (main).
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
